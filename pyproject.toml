[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleeperwatch"
version = "0.1.0"
description = "Record Amtrak sleeper fares over time and chart how they move."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["playwright>=1.45"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
sleeperwatch = "sleeperwatch.cli:main"

[tool.setuptools]
packages = ["sleeperwatch"]

[tool.setuptools.package-data]
sleeperwatch = ["watchlist.example.toml"]
