# What to watch. Edit freely; past dates drop off automatically.
# `sleeperwatch init` copies this file to your config directory;
# `sleeperwatch paths` shows where that is.
# Station codes are Amtrak's 3-letter codes (CHI = Chicago Union Station,
# NYP = New York Penn, SEA = Seattle King St, ...). The routes below are
# examples -- replace them with yours, and double-check train numbers on
# amtrak.com since they occasionally change.

[defaults]
passengers = 2          # room prices depend on party size; match how you'd book
only_sleepers = true    # store only room fares (set false to keep coach for comparison)
price_rooms = true      # also price Bedrooms etc., which Amtrak's search leaves unpriced (1 request each)
direct_only = true      # only single-train trips: skip connections and anything with a bus segment
refresh_window = 48     # hours: skip trip-dates searched more recently than this (fetch --force ignores it)
# fare_families = ["VLU", "FLX"]   # optional: Value, Flexible, Saver (SVR), Sale (SAL), ...

[[watch]]
name = "lake-shore-westbound"        # any label you like; must be unique. Names this watch in reports and charts
from = "NYP"
to = "CHI"
# trains = ["49"]                    # optional: only these train numbers. Omit to keep every direct train
accommodations = ["Roomette", "Bedroom"]   # substring match on room type; omit for all rooms
dates = ["2026-12-19", "2026-12-20"]

[[watch]]
name = "empire-builder-spring"
from = "CHI"
to = "SEA"
trains = ["7"]
passengers = 1                       # overrides the default
date_range = { start = "2027-04-01", end = "2027-04-30", weekdays = ["fri", "sat"] }
