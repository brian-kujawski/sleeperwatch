name: tests

on:
  push:
  workflow_dispatch:

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[plot]"
      - name: Offline tests (no network, no browser)
        run: python -m tests.test_offline
      - name: CLI entry point
        run: |
          sleeperwatch --help
          sleeperwatch --watchlist ci-watchlist.toml --data-dir ci-data init
          sleeperwatch --watchlist ci-watchlist.toml --data-dir ci-data fetch --dry-run
